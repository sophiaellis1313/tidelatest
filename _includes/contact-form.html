<script>

  // Helper function to get form data in the supported format
function getFormDataString(formEl) {
    var formData = new FormData(formEl),
      data = [];

  for (var keyValue of formData) {
      data.push(encodeURIComponent(keyValue[0]) + "=" + encodeURIComponent(keyValue[1]));
  }

  return data.join("&");
}

// Fetch the form element
var formEl = document.getElementById("cloud-cannon-contact-form");

// Override the submit event
formEl.addEventListener("submit", function (e) {
    e.preventDefault();

  // if (grecaptcha) {
  //     var recaptchaResponse = grecaptcha.getResponse();
  //   if (!recaptchaResponse) { // reCAPTCHA not clicked yet
  //     return false;
  //   }
  // }

  var request = new XMLHttpRequest();

  var successEl = document.getElementById("contact-form-success-messege")
  var errorEl = document.getElementById("contact-form-error-messege")

  request.addEventListener("load", function () {
    if (request.status === 303) { // CloudCannon redirects on success
      // It worked
      formEl.reset()
      successEl.style.display = 'block'
    }else {
      errorEl.style.display = 'block'
    }
    
    setTimeout(() => {
      successEl.style.display = 'none'
      errorEl.style.display = 'none'
    }, 5000);
    
  });

  request.open(formEl.method, formEl.action);
  request.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");
  request.send(getFormDataString(formEl));
});



  
</script>
