<section class="subscribe-section no-margin">
  <div class="image-container">
    <img src="{{ include.subscribe.images[0].src }}" alt="{{ include.subscribe.images[0].alt }}" class="media-image" />
  </div>

  <div class="subscribe-text">
    <h2 class="h1 mb-1">{{ include.subscribe.heading }}</h2>
    
    <div class="buttons">
      {% for button in include.subscribe.buttons %}
        {% if button.position == "left" %}
          <div class="left-arrow arrow mb-1">
            <svg width="36" height="4" viewBox="0 0 36 4" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M0.823223 1.82322C0.725592 1.92085 0.725592 2.07915 0.823223 2.17678L2.41421 3.76777C2.51184 3.8654 2.67014 3.8654 2.76777 3.76777C2.8654 3.67014 2.8654 3.51184 2.76777 3.41421L1.35355 2L2.76777 0.585786C2.8654 0.488155 2.8654 0.329864 2.76777 0.232233C2.67014 0.134602 2.51184 0.134602 2.41421 0.232233L0.823223 1.82322ZM36 2V1.75L1 1.75V2V2.25L36 2.25V2Z" fill="black"/>
            </svg>
            <button class="btn-border">
            <a href="{{ button.link }}" target="_blank">
              {{ button.text }}
            </a>
            </button>
          </div>
        {% elsif button.position == "right" %}
          <div class="right-arrow arrow">
            <button class="btn-border">
            <a href="{{ button.link }}" target="_blank">
              {{ button.text }}
            </a>
            </button>
            <svg width="36" height="4" viewBox="0 0 36 4" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M35.1768 1.82322C35.2744 1.92085 35.2744 2.07915 35.1768 2.17678L33.5858 3.76777C33.4882 3.8654 33.3299 3.8654 33.2322 3.76777C33.1346 3.67014 33.1346 3.51184 33.2322 3.41421L34.6464 2L33.2322 0.585786C33.1346 0.488155 33.1346 0.329864 33.2322 0.232233C33.3299 0.134602 33.4882 0.134602 33.5858 0.232233L35.1768 1.82322ZM0 2L0 1.75L35 1.75V2V2.25L0 2.25L0 2Z" fill="black"/>
            </svg>
          </div>
        {% endif %}
      {% endfor %}
    </div>
  </div>

  <div class="image-container right">
    <img src="{{ include.subscribe.images[1].src }}" alt="{{ include.subscribe.images[1].alt }}" class="media-image" />
  </div>
</section>
