    title: ' Panama to the Pacific '
    description: |2
       An epic voyage spanning over 7000 nautical miles, we follow photographer Stuart M Boliter to bring you to our favourite destinations in Panama and across the Pacific: luminescent turquoise waters, world class surfing, impossibly white beaches and myriad tiny islands teeming with sea life.
  - image: /uploads/download-48.jpg
    alt: ' Island Five Spice '
    link: /articles/four-islands
    tags: []
    title: ' Island Five Spice '
    description: ' If armed with fearless curiosity and a sailing yacht as a chariot, the world opens up in unimaginable ways. Taking to the open seas to chase the unfamiliar can lead to discoveries otherwise inaccessible. Considering the excitement and hunger for adventure that grip today’s intrepid sailors, a getaway to islands untrodden could be the perfect antidote to a year spent in lockdown.  '
  - image: /uploads/download-49.jpg
    alt: ' Hidden Gems: Naples & The Amalfi Coast '
    link: /articles/hidden-gems-naples-amalfi
    tags: []
    title: ' Hidden Gems: Naples & The Amalfi Coast '
    description: ' The Bay of Naples and its glittering islands need no introduction. Get away from the crowded hotspots with these lesser-known beaches, secret caves and waterside trattorias.  '
  - image: /uploads/download-50.jpg
    alt: ' The Azores - A Place to Sea '
    link: /articles/azores
    tags: []
    title: ' The Azores - A Place to Sea '
    description: ' The Azores — Portuguese-speaking, verdant and wild — is that rare destination where a remote setting gives way to having it all… '
  - image: /uploads/download-51.jpg
    alt: ' Sailing in the City - New York '
    link: /articles/new-york
    tags: []
    title: ' Sailing in the City - New York '
    description: ' New York City reserves some of its most spectacular panoramas for those lucky enough to visit by boat. '
