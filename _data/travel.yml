      - number 05
    title: ' Hidden Gems: The Cyclades '
    description: ' Challenging sailing conditions in this corner of the Greek islands during July and August means they’re not always the first choice for sailors. Those who do take them on are rewarded with azure waters, excellent food and strong winds adding a sense of adventure, as well as long and pleasant shoulder seasons in Spring and Autumn. '
  - image: /uploads/download-34.jpg
    alt: ' Hailing Maine '
    link: /articles/maine
    tags:
      - ' Travel I '
      - number 05
    title: ' Hailing Maine '
    description: ' Maine is a place with a humble appreciation for fine craftsmanship and a love for the sea. Its coast lures the sailor in with its quaint nautical heritage and bountiful charm. Whether these are familiar waters or the first inklings of a plan, the abundance of islands, bays, inlets and passageways will satisfy any voyager for a lifetime.  '
  - image: /uploads/download-35.jpg
    alt: ' Checking In: Bill & Coo, Mykonos  '
    link: /articles/bill-and-coo
    tags: []
    title: ' Checking In: Bill & Coo, Mykonos  '
    description: ' Escape the crowds on the hedonistic Greek island of Mykonos with pared-back architecture and unbridled luxury at Bill & Coo, a sun-drenched oasis tucked away on the edge of Mykonos town. On the most stylish of all the Greek islands, Bill & Coo is becoming a favourite with in-the-know insiders and return Superyacht visitors. '
  - image: /uploads/download-36.jpg
    alt: ' Hotel Excelsior Dubrovnik '
    link: /articles/hotel-excelsior
    tags: []
    title: ' Hotel Excelsior Dubrovnik '
    description: ' Dreaming of panoramic views and sun-drenched afternoons, TIDE checks out Dubrovnik’s Balkan beauty from the shoreline at Hotel Excelsior ahead of the 2023 Summer season '
