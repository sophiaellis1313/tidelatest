      title: Sailing Cuba
      description: >+
        Author, photographer and long-time Cubanophile and specialist Cynthia
        Carris Alonso describes the island nation as being “in a surreal state,
        paused in time with classic cars, neoclassical architecture, antiques
        and other ubiquitous homages to the past. However, if one looks into the
        soul of Cuba today, one finds a rapidly changing and developing culture
        of entrepreneurship, bubbling with hope, excitement and opportunity.”

    - image: /uploads/checkin-5-min-1.png
      alt: ''
      link: articles/refugia-chiloe
      tags:
        - travel
        - number 12
      title: 'Checking in: Refugia Chiloé'
      description: >
        There’s magic in the air at Refugia Chiloé. Early on my first morning,
        surrounded by the scent of damp earth on the hotel’s dew-covered
        backyard trail, a hummingbird stops to peer at me with beady black eyes,
        iridescent feathers shimmering in the pale light, wings a blur as it
        hovers in my eyeline. It’s gone in an instant but the image remains, a
        harbinger of the many precious moments that await guests at this 24-room
        hotel set on the edge of the remote
    - image: /uploads/download-12.jpg
      alt: ''
      link: articles/posada-ayana
      tags:
        - travel
        - number 12
      title: 'Checking in: Posada Ayana'
      description: >+
        There’s something about the rugged Uruguayan peninsula where José
        Ignacio is located. The little fishing village, relatively unknown until
        recently, has a slower pace of life. In winter, the population is less
        than 300 permanent residents, according to the most recent census. In
        summer, however, the population swells. Historically, the town welcomed
        South American elite – mostly from Argentina – today, anyone in the
        know, from anywhere, stops by.

    - image: /uploads/download-13.jpg
      alt: 'Sailing Stockholm '
      link: articles/sailing-stockholm
      tags:
        - travel
        - number 11
      title: Sailing Stockholm
      description: >+
        An ethereal group of 30,000 islands, the Stockholm archipelago – called
        the skärgården by locals – is a little piece of bliss in the Baltic Sea.
        These lands are perfect for slow travel: long days spent in the
        outdoors, living by the gentle rhythms of the sea and the sun.
        Itineraries here are often left by the wayside, given the number of
        possible stops; anchorages abound, as do pretty views and opportunities
        to get out and explore, so take this as a rough guide for you to play
        with.

    - image: /uploads/download-14.jpg
      alt: ''
      link: articles/project-o
      tags:
        - travel
        - number 11
      title: 'Hidden Gems: Project Ö, Skjulskäret'
      description: >+
        Those few days alone on tiny Skjulskäret, a measle of granite and gneiss
        among the 40,000 or so islands of the Finnish archipelago, feel like a
        reverie now. The slow days my partner and I spent in the gable-roofed,
        Monopoly-esque timber house of Project Ö (“Project Island”): cooking
        beef and foraged mushroom pot pies; exploring our rocky, forested little
        universe; watching spiders weave jewel-drop webs that wobbled in the
        same winds that whooshed over the sea, where the Gulf of Bothnia meets
        the Gulf of Finland and the Baltic Sea. During sauna sessions
        interspersed with goosebumped leaps from the little jetty into the
        frigid water, we’d see sailing boats in the distance beyond other tiny
        islands. But real life felt like an almost absurd abstraction; something
        that was happening somewhere else, as the Mondaine clock rotated
        silently in our little world.

    - image: >-
        /uploads/issue-11/tide-magazine-sailing-lifestyle-travel-issue11-hermitage-2.jpg
      alt: ''
      link: articles/hermitage-bay
      tags:
        - travel
        - number 11
      title: 'Checking In: Hermitage Bay, Antigua'
      description: >+
        Situated at the foot of a hill on Antigua’s unspoilt west coast,
        Hermitage Bay has long held a reputation for setting the bar in barefoot
        luxury. Now, under the leadership of new owner Daniel Shamoon of Luxury
        Hotels Partners (LHP) – who is also part-owner of Nobu on Antigua’s twin
        island Barbuda – the resort has entered a thoughtful next chapter.
        Following an extensive refurbishment, yet with its natural environment
        preserved, Hermitage Bay is poised to redefine what travellers can
        expect from a Caribbean retreat.

