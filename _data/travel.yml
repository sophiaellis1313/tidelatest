      title: ' Hidden Gems: Sardinia and Corsica '
      description: ' The Mediterranean islands reward those who explore off the beaten track by revealing their secrets: wild interiors, powdery white beaches, delicious local cuisine and colourful festivals '
    - image: /uploads/download-32.jpg
      alt: ''
      link: articles/les-regalia
      tags:
        - travel
        - number 06
      title: 'Checking In: Les Regalia, Corsica'
      description: >-
        Corsica holds a special kind of allure: a stunning coastline, immaculate
        beaches, turquoise waters and a blend of natural beauty and in-depth
        history combine to create an idyllic playground. But beyond her
        breathtaking landscapes – between a dash of glamour and a splash of
        adventure – Corsica offers a refined Mediterranean lifestyle with
        charming coastal towns and world-class dining to explore. In the midst
        of all this is Les Regalia, where the island’s ancient traditions
        intertwine with a modern, minimalist feel.
    - image: /uploads/download-33.jpg
      alt: ''
      link: articles/cyclades-hidden-gems
      tags:
        - travel
        - number 05
      title: 'Hidden Gems: The Cyclades'
      description: >+
        For decades, sailors have set a course for the Cyclades, but not only
        for its myriad cultural attractions, sandy beaches, hidden coves and
        gin-clear seas. In spite of a predominantly dry, rocky landscape, this
        island region grows some spectacularly delicious and versatile produce,
        such as Santorini’s cherry tomato and crisp katsouni cucumber, and
        Serifos’ wild fennel and capers. These fine raw materials lend
        themselves to a wealth of traditional dishes that, thankfully, can still
        be found at tavernas and reinterpreted at high end restaurants. Here, we
        explore dining at two destinations, one well-known and the other less
        so, which are worth incorporating into your Cycladic sojourn.

    - image: /uploads/download-34.jpg
      alt: ''
      link: articles/maine
      tags:
        - travel
        - number 05
      title: Hailing Maine
      description: >+
        Clustered with classic sailboats and wooden Windjammer schooners that
        navigate the winding channels as they have been doing for hundreds of
        years, Maine is no stranger to the nautical way of life.

    - image: /uploads/download-35.jpg
      alt: 'Checking In: Bill & Coo, Mykonos'
      link: articles/bill-and-coo
      tags:
        - travel
        - number 05
      title: 'Checking In: Bill & Coo, Mykonos'
      description: >+
        Mykonos is not known for doing things in halves. Love it or hate it,
        every mile of the best-known island in the Cyclades reveals yet more
        magical corners and luxury hangouts. This makes it all the more
        challenging for a newcomer to do something differently, and carve out an
        individually tailored experience.

    - image: /uploads/download-36.jpg
      alt: ''
      link: articles/hotel-excelsior
      tags:
        - travel
        - number 04
      title: Hotel Excelsior Dubrovnik
      description: >+
        It all started with a photograph. Flicking through an album of
        whimsical, white-washed photographs by Natalie Obradovich, who shot our
        Italian hidden gems along the Amalfi Coast in the first issue of TIDE, I
        stumbled upon this image one grizzly January evening. It was of an
        aquamarine, marble-lined swimming pool built into the rocks, the bay of
        Dubrovnik stretching out in the foreground.

    - image: /uploads/download-37.jpg
      alt: ''
      link: articles/hidden-gems-croatia
      tags:
        - travel
        - number 04
      title: 'Hidden Gems: Croatia and Montenegro'
      description: >+
        One of the four historical regions of Croatia, the Dalmatian Coast is
        fast surpassing Greece, Italy and the South of France as far as the
        elite sailing community are concerned. This section of the famously
        beautiful Adriatic coastline has hundreds of sandy islands, walled
        citadels, and among the most spectacular turquoise waters in Europe. The
        region is also home to some of the most famous cities, towns and tourist
        attractions in Croatia, including Dubrovnik, Šibenik, Split and Zadar,
        as well as an array of UNESCO World Heritage Sites. Aside from these
        main attractions, though, there are still countless hidden gems to be
        found if you know where to look. Just down the coast in little
        Montenegro, meanwhile, adventurous sailors are rewarded with steep,
        dramatic mountain landscapes sloping straight down into the water. The
        sea here is cool, clean and impossibly deep blue, a world apart from the
        Italian coastline just a short hop across the Adriatic sea.

    - image: /uploads/download-38.jpg
      alt: ''
      link: articles/finding-fjorland
      tags:
        - travel
        - number 04
      title: Finding Fjorland
      description: >+
        Arriving in Norway by boat often feels like half the battle won, after a
        long passage across the choppy North Sea. Boats coming from outside the
        Schengen zone should head into one of the dozen-or-so ports of entry –
        perhaps the easiest being Tanager and Bergen on the crinkly west coast.
        These are also the best places to make crew changes or take on guests,
        and for replenishing the fridges.

    - image: /uploads/3dcysxj8-1.jpg
      alt: ''
      link: articles/colibri-antigua
      tags:
        - travel
        - number 03
      title: A French-Créole sweet spot - Colibri, Antigua
      description: >+
        Even returning visitors can’t help but be taken aback by the scene that
        greets them at Colibri: a lush garden shaded by 60 year-old Flamboyant
        trees, a ‘cabana’ bar, and an elegant wooden-clad restaurant, housed in
        one of the oldest wooden cottages in the village. Despite its location
        in the heart of Antigua’s historic English Harbour, Colibri is as
        secluded as it is special – treasured not only for its beautiful
        setting, but for its refined menu, personal charm, and of course, the
        peerless cocktail list.

