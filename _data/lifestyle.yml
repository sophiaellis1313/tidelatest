content_on_image:
  image: >-
    /uploads/issue09/tide-magazine-sailing-lifestyle-travel-issue09-gourmand-barcelona-1.jpg
  alt: The Gourmand's Guide to Barcelona
  tags:
    - Lifestyle
    - Number 09
  title: The Gourmand's Guide to Barcelona
  description: >+
    As the 37th America’s Cup approaches, Barcelona is not just preparing for an
    influx of sailing enthusiasts, but also for food lovers eager to explore its
    culinary landscape. There is no city quite like Barcelona in terms of
    dining, where the essence of Catalan cuisine, market-fresh produce,
    Modernisme design, the Mediterranean Sea and innovative Chefs converge to
    create a foodie’s dream. With more than 8,000 eateries and 35 Michelin
    stars, there is much to devour.

  button:
    text: More
    link: articles/gourmand-barcelona
    class: width-fit btn white-btn
featured_section:
  cards:
    - image: >-
        /uploads/issue-07/tide-magazine-sailing-lifestyle-travel-issue07-baltic-rendezvous2.jpg
      alt: 'A Family Affair: The Baltic Yachts Rendezvous 2023'
      link: articles/baltic-rendezvous
      tags:
        - Lifestyle
        - number 07
      title: 'A Family Affair: The Baltic Yachts Rendezvous 2023'
      description: >+
        September saw a special spectacle take place just off the shores of
        Sardinia: a vision of the latest Superyachts sailing alongside modern
        classic 1970s sailboats. The occasion? A four-day celebration of
        everything that Baltic Yachts has achieved in its half-century history
        so far. More guests than ever before came together, including owners,
        service and refit friends and industry figures – such as ourselves at
        TIDE – for a long weekend of sailing and feasting on fantastic Italian
        food, in this, the culmination of Baltic’s extended anniversary event,
        known as the Rendezvous.

    - image: >-
        /uploads/tide-magazine-sailing-lifestyle-travel-issue06-superyacht-gathering2.jpg
      alt: ' Pacific Time '
      link: /articles/superyacht-gathering
      tags:
        - 'Lifestyle '
        - number 06
      title: ' Pacific Time '
      description: ' Luring sailors away from the Mediterranean and Caribbean to the wild of the South Pacific is no easy feat but Linda Berry, founder of The Superyacht Gathering, has sparked a ripple… '
    - image: /uploads/tide-magazine-sailing-lifestyle-travel-issue06-restaurant1.jpg
      alt: ' Corsican Bounty '
      link: /articles/restaurant-corsica
      tags:
        - Lifestyle
        - number 06
      title: ' Corsican Bounty '
      description: ' Discover Domaine de Murtoli, a 2,500-hectare ode to slow, sustainable living – and simply incredible food '
    - image: /uploads/tide-magazine-sailing-lifestyle-travel-issue05-cyclades1.jpg
      alt: 'The High Low: Cyclades '
      link: /articles/cyclades
      tags:
        - Lifestyle
        - number 05
      title: 'The High Low: Cyclades '
      description: ' Greece’s Cyclades islands are an absolute joy to sail, but strong winds can also make them a challenge. Slow down, take your time and savour local delicacies at tiny tavernas, or seek out some of the finest dining the country has to offer.  '
    - image: /uploads/tide-magazine-issue04-high-low-2-1.jpg
      alt:
      link: articles/high-low-croatia.html
      tags:
        - lifestyle
        - number 04
      title: 'The High Low: Croatia'
      description: >+
        With its spectacular coastline and endless summer days, Croatia has been
        a draw for those wanting to escape the usual sailing rat race for
        decades. Pristine waterside eateries, panoramic rooftop bars and
        restaurants serving only the freshest catch come as standard in the
        Adriatic. With a heavy Italian influence from across the water, the food
        scene here focuses on using local, organic ingredients with chefs
        letting the simple flavours shine with little fuss or fanfare. Here, we
        explore two of the greatest stops to weave into any sailing itinerary
        around the Dalmatian coastline. 

    - image: /uploads/tide-magazine-issue04-food-as-medicine-1-1.jpg
      alt:
      link: articles/food-as-medicine
      tags:
        - lifestyle
        - number 04
      title: Food as Medicine
      description: >+
        Sculpted by sky-piercing, moss-green peaks and crystal clear waters,
        French Polynesia is a place to slow down and take it all in. Not for
        everyone, however. As we sit down with Superyacht Chef Polly Baptist,
        currently working aboard 44.7m Ningaloo, she’s madly cleaning and
        restocking the yacht ahead of a two month trip around the outer atolls
        with its owners. 

    - image: /uploads/tide-magazine-issue04-above-and-beyond-2-1.jpg
      alt:
      link: articles/above-and-beyond
      tags:
        - lifestyle
        - number 04
      title: Above and Beyond
      description: >+
        Although he grew up on the Norfolk Broads, Tom Hollyhomes discovered
        sailing a little later in life. At the ripe age of 18, he had his first
        experience in the yachting world, working for Sunsail in Turkey, and in
        his words explained; “I had no idea what I was in for.” Little did he
        know then that it would take him on a whirlwind adventure with eleven
        Caribbean seasons under his belt. Having good mentors to guide him
        through the industry on S/Y Andromeda meant he progressed through his
        qualifications quickly and, in his early 20s, found himself onS/Y
        Marie. 

    - image: /uploads/wlitymjm-1.jpg
      alt:
      link: articles/a-cooking-collaboration-the-galley-gang
      tags:
        - lifestyle
        - number 03
      title: A Cooking Collaboration - The Galley Gang
      description: >+
        Whether you own or charter a Superyacht, getting to know your private
        on-board chef is a true luxury. Often with years of expertise in villas,
        chalets and aboard other yachts, it’s a rare and finely tuned talent to
        be able to prepare virtually any request at the drop of a hat. Add often
        cramped galley conditions, dietary requirements and difficulty in
        getting ingredients to the mix, and the challenge is even greater.

    - image: /uploads/rlzed8ta-1.jpeg
      alt:
      link: articles/an-endless-summer
      tags:
        - lifestyle
        - number 01
      title: An Endless Summer
      description: >+
        Pippa Crowley is quite the paradox; a young, fresh and exciting chef who
        is also something of a galley veteran.

    - image: /uploads/vrnfwu7c-1.jpeg
      alt:
      link: articles/diving-for-dinner
      tags:
        - lifestyle
        - number 01
      title: Diving for Dinner
      description: >+
        For the average traveller, spending time in Portugal soaking up the
        warmth of the Algarve can be a round-the-clock fixation. For
        Australian-native superyacht chef Nathan Clements, time spent in the
        sunny, southwest pocket of the Iberian Peninsula only had him yearning
        for more. Sometimes, it’s not enough to simply be close to the water;
        you’ve got to get in the water.

