    short_description: >-
      It’s not a Chef’s cooking that leaves an impression on Antiparos, it’s
      “the quality of each ingredient and the beauty of the setting” – and
      that’s what Cookoovaya Antiparos’s Chef is saying himself. Try this simple
      fish crudo recipe and see for yourself.
