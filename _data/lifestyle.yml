  - image: /uploads/tide-magazine-sailing-lifestyle-travel-issue12-ocean-breeze-1.jpg
    alt: Ocean Breeze
    link: /articles/ocean-breeze.html
    tags:
      - Lifestyle
      - number 12
    title: Ocean Breeze
    description: >-
      So much of a wine’s identity hinges on its terroir – the growing
      conditions unique to a particular location. At Bodega Oceánica José
      Ignacio winery on Uruguay’s Atlantic coast, that’s a trio of clay soils, a
      mild climate (where it never gets too hot or too cold) and an ocean air
      that swoops up from not only the Atlantic Ocean but also the two lagoons
      that bookend the once sleepy nearby fishing village of the same name, now
      a bohemian hotspot and starry hangout.
  - image: >-
      /uploads/issue-11/tide-magazine-sailing-lifestyle-travel-issue11-joysail-1.jpg
    alt: ''
    link: articles/joysail
    tags:
      - lifestyle
      - number 11
    title: A Good Weekend
    description: >+
      Ibiza JoySail, one of the newer competitions around today, has quickly
      become a beloved fixture for sailing enthusiasts. Launched in 2021, just
      four years later it has caught the heart of even the most discerning
      sailor thanks to its blend of exhilarating racing and well-liked social
      events, all set to a backdrop of the beautiful Mediterranean, and along
      the picturesque coast of Ibiza and Formentera.

