# _data/about.yml

about_section:
  title: "ABOUT TIDE MAGAZINE"
  subtitle: "We explore the shifts and changes at the core of the sailing world..."
  paragraph_1: |
    TIDE is an independent sailing, lifestyle, and travel magazine, published in print and digital.
    We explore the shifts and changes at the core of the sailing world and the ocean adventure: 
    the vessels, the people, the experiences, the destinations — the many facets that entice 
    individuals around the world to pursue this alluring form of adventure.
