about_section:
  title:
  subtitle: >-
    TIDE Magazine is published by a group of passionate sailors and adventurers, writers and photographers, eager to share their wealth of knowledge from personal experiences within the core of the sailing Superyacht industry. 
  paragraph_1: >-
    <p>We celebrate the adventure shared between those attracted to this unique, fast-paced lifestyle. 
       With content, photography and design, we seek to inspire our audience to explore and enjoy sailing to its fullest. The remarkable yachts, distinctive owners and talented sailors – all with stories to tell.</p>
    <p>TIDE offers an authentic perspective to explore the core of the sailing Superyacht world and ocean adventures: the vessels, the people, and locations— the many facets that attract so many individuals worldwide to pursue this captivating            form of exploration. </p>
    <p>It’s about adventure, lifestyle, travel, design, environment, technology, culture, and cuisine. 
       We seek to expose the locale, the fare, and to recognise and celebrate the sense of community shared by those who are drawn to this exciting lifestyle. </p>
    <p>Providing a sought-after platform for the yacht owners, industry and extending readership. TIDE sits at the forefront of this wondrous lifestyle, showcasing the yachts, the destinations, the environment,  design and cutting-edge                    technologies they utilise — with a renewed focus on sustainability. The yachts traverse the oceans that connect us, exploring the most natural wonders of our world.</p>
    <p>Our sophisticated content and exceptional photography enable readers to experience the adventure of sailing, and the extraordinary lifestyle it embodies.</p>
    <p class="highlighted-text">A sailing lifestyle is the ultimate escape. Beautiful and Audacious.</p>
  paragraph_2: ''
