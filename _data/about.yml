about_section:
  title:
  subtitle: >-
    TIDE offers an authentic and sophisticated perspective; the chance to
    explore the shifts and changes at the very core of the sailing Superyacht
    world.
  paragraph_1: >-
    <p>the boats, the people, the experiences, the destinations – the many facets
    that entice so many individuals to pursue this alluring form of
    international exploration. From the much beloved to the off-grid, it reveals
    the inside track on the most exquisite Superyacht stops across the globe, as
    well as recognises and celebrates the sense of kinship that exists between
    those drawn to this exciting lifestyle.</p>
    <p>Providing a sought-after platform
    for the Superyacht sailing community to share their stories, TIDE is also a
    space to hear more from the vanguard of the industry’s designers and
    engineers on the cutting-edge technologies they apply – with a newfound
    emphasis on sustainability – to produce the most extraordinary vessels
    launched to date. These yachts traverse the oceans that connect us,
    exploring up-close the most miraculous natural wonders out there.</p>
    <p>Through its high quality writing and exceptional photography, new and non-sailors
    are also given a true taste of the extraordinary lifestyle it embodies – the
    ultimate, beautiful and audacious escape.</p>
  paragraph_2: ''
