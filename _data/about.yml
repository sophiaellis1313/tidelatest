legal_section:
  heading: LEGAL
  tabs:
    - title: Terms and Conditions
      content: >
        <p>Thank you for visiting our site and shopping with TIDE. Here is a list of details you'll need to know before browsing our site and placing an order with us.</p>

        <h3>COPYRIGHT & USAGE</h3>
        <p>You are welcome to use the product photos from our online shop page and site, as long as you properly credit TIDE Magazine and link back to our homepage or the product page. Photos may not be used for any other purpose and may not be altered. All content on this website is copyrighted. High resolution product photos are available upon request at editor@tide-magazine.com.</p>

        <h3>PAYMENT</h3>
        <p>We are currently accepting payment via debit/credit card, as well as Paypal. To use a debit or credit card, simply enter your card information when prompted, and your account will be securely charged.</p>

        <h3>SHIPPING</h3>
        <p>To see detailed information about Shipping, view our Shipping Policy</p>

        <h3>RETURNS</h3>
        <p>At this time, we do not offer returns or exchanges. If you are unsatisfied with your order within 7 days of receiving your package, please contact us at editor@tide-magazine.com.</p>

        <h3>DUTIES/TAXES</h3>
        <p>International packages may incur taxes/duties. Please familiarise yourself with your country’s fees before placing an order. TO THE SEA MEDIA Ltd is legally obligated to enter the full value of orders on customs forms.</p>

        <h3>CANCELLATIONS</h3>
        <p>We will try our best to fulfil every order as specified in our terms, but delays and cancellations may occur for reasons beyond our control. We reserve the right to cancel any orders for any reason, refunding our customers for the full amount immediately.</p>

        <h3>ASSISTANCE</h3>
        <p>For any further assistance, please get in touch at editor@tide-magazine.com</p>

