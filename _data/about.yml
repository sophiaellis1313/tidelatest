# Banner section
banner:
  video: true  # Set to false if you want to show an image instead of a video
  video_path: "/path/to/video.mp4"  # Path to the video file
  cover_image: "/images/about-banner.png"  # Poster image for the video
  featured_image:
    url: "/images/about-banner.png"  # Path to the image when video is disabled
    position: "center"  # Position of the image, e.g., "center", "top", "bottom"
  link_url: "/about"  # URL to navigate to when the banner is clicked

welcome:
  title: "WELCOME TO"
  logo_url: "/images/white-logo.png" 

