legal_section:
  heading: LEGAL
  tabs:
    - title: Terms and Conditions
      content: >
        <p>Thank you for visiting our site and shopping with TIDE. Here is a list of details you'll need to know before browsing our site and placing an order with us.</p>

        <h3>COPYRIGHT & USAGE</h3>
        <p>You are welcome to use the product photos from our online shop page and site, as long as you properly credit TIDE Magazine and link back to our homepage or the product page. Photos may not be used for any other purpose and may not be altered. All content on this website is copyrighted. High resolution product photos are available upon request at editor@tide-magazine.com.</p>

        <h3>PAYMENT</h3>
        <p>We are currently accepting payment via debit/credit card, as well as Paypal. To use a debit or credit card, simply enter your card information when prompted, and your account will be securely charged.</p>

        <h3>SHIPPING</h3>
        <p>To see detailed information about Shipping, view our Shipping Policy</p>

        <h3>RETURNS</h3>
        <p>At this time, we do not offer returns or exchanges. If you are unsatisfied with your order within 7 days of receiving your package, please contact us at editor@tide-magazine.com.</p>

        <h3>DUTIES/TAXES</h3>
        <p>International packages may incur taxes/duties. Please familiarise yourself with your country’s fees before placing an order. TO THE SEA MEDIA Ltd is legally obligated to enter the full value of orders on customs forms.</p>

        <h3>CANCELLATIONS</h3>
        <p>We will try our best to fulfil every order as specified in our terms, but delays and cancellations may occur for reasons beyond our control. We reserve the right to cancel any orders for any reason, refunding our customers for the full amount immediately.</p>

        <h3>ASSISTANCE</h3>
        <p>For any further assistance, please get in touch at editor@tide-magazine.com</p>

    - title: Privacy Policy
      content: |
        <h3>PRIVACY POLICY</h3>
        <p>TO THE SEA MEDIA Ltd & TIDE Magazine respects your right to privacy, 
        and is committed to protecting and safeguarding your personal data. As part of 
        this commitment, we have updated our privacy policy to meet the high standards of the European data protection 
        law, known as the General Data Protection Regulation (GDPR).</p>
        <p>
        Our updated policy, outlined below. By continuing to use our site after this date, you agree to these updated terms.
        This privacy policy may change from time to time so please check back here regularly.</p>
        <h3>1. What information do we collect from you?</h3>
        <p>The information you give us may include your name and contact details, including address, 
        telephone number, and email address, as well as your payment information. This occurs when you place an order on our online shop; 
        email us your information in regards to an order; create an online account; subscribe to our newsletter; and/or participate in a 
        reader’s survey or competition.</p>
        <p>Information that is provided by you will only be used for the purpose for which it is provided, unless you are informed otherwise
        at the time of giving the information.</p>
        <h3>2. How do we use your information?</h3>
        <p>We may use your information to provide goods and services that you have requested, and to communicate with you about those goods and services;
        to operate our site; to comply with applicable law; and as otherwise permitted by applicable law.</p>
        <p>TO THE SEA MEDIA Ltd. may also contact you about your registration details, to manage any account or subscription you have with us, or to
        provide customer service, even if you have opted-out of, or declined to consent to receiving promotional emails. 
        We may also contact you if we consider that revisions to this privacy policy are sufficiently important to notify you about them.</p>
        <h3>3. How do we share your information?</h3>
        <p>We may disclose your personal information to partners of TIDE Magazine. who supply services to you on behalf of TO THE SEA MEDIA Ltd and 
        TIDE magazine, and who need to process personal information in the provision of such services. When you request goods and services from us, 
        you are consenting to the disclosure of your personal information to our partners who may provide such goods and services under contract and
        guarantee to our satisfaction that they have sufficiently robust processes in place to ensure the security of your personal information whilst
        it is in their care. This includes our fulfillment house – who are GDPR compliant – who we share customer order mailing information with, 
        via password-encrypted spreadsheets.</p>
        <p></p>
        <p>We may disclose your personal information to third parties:</p>
        <p></p>
        <p>In the event that we sell or buy any business or assets, in which case we may disclose your personal data
        to the prospective seller or buyer of such business or assets.</p>
        <p></p>
        <p>If all or substantially all of our assets are acquired by a third party, in which case personal data held by us about our customers
        will be one of the transferred assets</p>
        <p></p>
        <p>We may disclose de-personalised data (such as aggregated statistics) about the users of our website in order to describe our sales,
        customers, traffic patterns, and other site information to prospective partners, advertisers, investors, and other reputable 
        third parties and for other lawful purposes; but these statistics will include no personally identifying information.</p>
        <p>Under certain circumstances we may occasionally be required by law, court order, or governmental authority to disclose certain types 
        of personal information and we reserve the right to comply with any such legally binding request.</p>
        <p>Other than this, TO THE SEA MEDIA Ltd and TIDE Magazine. will not disclose any of your personal information 
        to any other third parties without your consent.</p>
        <h3>4. How long will we keep your information?</h3>
        <p>We will hold your information on our system only for as long as is necessary – such as fulfilling a 
        request for goods and services. After that timeframe, your information will be securely deleted, or in some cases, anonymised.</p>
        <h3>5. How is your information stored and kept secure?</h3>
        <p>The website and our server have appropriate technical measures in place to protect against unauthorised or unlawful use of your
        personal information, as well as the accidental loss, destruction, or damage of your information while under our control. 
        However, no data transmission over the internet can be guaranteed to be 100% secure,
        and while we strive to protect your personal information, we cannot guarantee the security of any information you transmit to us
        and you do so at your own risk.</p>
        <h3>6. Who is responsible for your data?</h3>
        <p>TO THE SEA MEDIA Ltd. is responsible for your data. Our registered address is Maritime House, Discovery Quay, Falmouth,
        Cornwall United Kingdom, TR11 3XA.</p>
        <h3>7. What are your rights?</h3>
        <p>If you gave us your consent to use your data, for example, so that we can send you marketing emails,
        you can withdraw your consent by emailing us at editor@tide-magazine.com.</p>
        <p>When you get in touch, we will come back to you as soon as possible, and where possible within one month.
        If your request is more complicated, it may take a little longer to come back to you.</p>
        <p>If you have any complaints regarding Cereal Ltd.’s processing of your personal information, 
        please email us at editor@tide-magazine.com. with the subject – Data Controller – or write to us at, TO THE SEA MEDIA Ltd Maritime House,
        Discovery Quay, Falmouth, Cornwall United Kingdom, TR11 3XA.</p>
        <p>Please note that you have the right to lodge a complaint with the supervisory authority, which is responsible for the protection
        of personal information in the country where you live or work, or in which you think a breach of data protection laws might have taken place.</p>
        <h3>COOKIES</h3>
        <p>Cookies are pieces of information that a website transfers to your hard drive to store and sometimes track information about you.
        Cookies are common and won’t do anything to harm your system – they simply store or gather information. They help you to get the most out
        of your visit to our website.</p>
        <p>We may collect information about your computer including, where available, your IP address, operating system, and browser type for system
        administration as part of our audit trail process. Most web browsers automatically accept cookies,
        but if you prefer, you can change your browser to prevent that. You are not obliged to accept cookies and you can adjust your browser’s 
        setting to prevent it from accepting cookies on your computer.
        Please note you may not be able to take full advantage of our website if you do so.</p>
        <p>Cookies are specific to the server that created them and cannot be accessed by other servers,
        which means they cannot be used to track your movements around the web. Although they can be used to store information which may identify 
        a user’s computer, cookies do not personally identify users and passwords, and credit card information are not stored in cookies.</p>
        <p>We use Cookies on the site to collect anonymous data about our visitors, and we use this data to improve our services to you.
        We never track our website users for the purposes of displaying targeted advertising. By using the website, you agree to our use of Cookies.</p>

