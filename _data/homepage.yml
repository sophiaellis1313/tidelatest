      - number 10
    title: 'The Force of Nature '
    description: >-
      On the island of Pianosa, surrounded by the vividly cerulean waves of the
      Tyrrhenian Sea, there is an empty prison. The isle is a relatively small
      piece of land – just a little more than ten square kilometres
  - image: /uploads/environment-example-1.png
    alt: A Letter from Norway
    link: articles/letter-from-norway.html
    tags:
      - ENVIRONMENT
      - number 11
    title: A Letter from Norway
    description: >-
      Pale, sunny yellow buildings dance on the surface of the dark, calm water;
      a gap, then its neighbour, white, moves in a chaotic sort of synchrony
      with it
  - image: >-
      /uploads/issue-05/tide-magazine-sailing-lifestyle-travel-issue05-environment1.jpg
    alt: The Winds of Change
    link: articles/veer
    tags:
      - Environment
      - Number 05
    title: The Winds of Change
    description: >-
      In a world grappling with the early devastating effects of a warming
      climate, the maritime world stands apart as an oft-overlooked contributor
  - image: /uploads/environ-2.png
    alt: Life in the Meadows
    link: articles/sea-trees
    tags:
      - environment
      - number 09
    title: Life in the Meadows
    description: >-
      A slick, shiny creature darts between long blades of jade green grass.
      He’s cautious. The grass is safe, but his silvery body sparkles against
      the sun’s rays; flickering between shadows, he’s easy to spot
cards6:
  - image: >-
      /uploads/issue-12/tide-magazine-sailing-lifestyle-travel-issue12-ocean-breeze-1.jpg
    alt: Ocean Breeze
    link: articles/ocean-breeze
    tags:
      - Lifestyle
      - number 12
    title: Ocean Breeze
    description: >-
      So much of a wine’s identity hinges on its terroir – the growing
      conditions unique to a particular location. At Bodega Oceánica José
      Ignacio winery on Uruguay’s Atlantic coast, that’s a trio of clay soils, a
      mild climate (where it never gets too hot or too cold) and an ocean air
      that swoops up from not only the Atlantic Ocean but also the two lagoons
      that bookend the once sleepy nearby fishing village of the same name, now
      a bohemian hotspot and starry hangout
  - image: >-
      /uploads/issue-10/tide-magazine-sailing-lifestyle-travel-issue10-chef-1.jpg
    alt: A Taste of Tuscany
    link: articles/taste-of-tuscany
    tags:
      - Lifestyle
      - number 10
    title: A Taste of Tuscany
    description: >-
      Thoughts of Tuscany are often accompanied by visuals of rolling green
      hills and dirt roads lined by fragrant cypress. Groves of ancient olive
      trees sit beside sun-drenched fields of golden wheat and vineyards full of
      plump grapes ready to be crushed and fermented into bottles of heady
      Tuscan reds
  - image: >-
      /uploads/issue09/tide-magazine-sailing-lifestyle-travel-issue09-mallorcan-food-1.jpg
    alt: The Spirit Of Mallorca In A Recipe
    link: articles/mallorcan-food
    tags:
      - 'Lifestyle '
      - Number 09
    title: The Spirit Of Mallorca In A Recipe
    description: >-
      As is the way with many Mediterranean isles, the Mallorcan heritage is a
      tapestry woven by invaders and ingredients, occupations and innovations.
      The complex layers of its past are seen in the architecture, the
      agriculture, the traditions and, of course, in the food
  - image: >-
      /uploads/issue09/tide-magazine-sailing-lifestyle-travel-issue09-gourmand-barcelona-1.jpg
    alt: The Gourmand's Guide to Barcelona
    link: articles/gourmand-barcelona
    tags:
      - lifestyle
      - number 09
    title: The Gourmand's Guide to Barcelona
    description: >-
      As the 37th America’s Cup approaches, Barcelona is not just preparing for
      an influx of sailing enthusiasts, but also for food lovers eager to
      explore its culinary landscape
