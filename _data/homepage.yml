    title: 'Checking In: Skinopi Lodge'
    description: >+
      Go back to soothingly simpler times in comfort via a stay at one of these
      eco-chic boathouse-villas, located on arguably the most stunning of all
      the Cyclades islands. Owner Nausika Georgiadou gives us the downlow

