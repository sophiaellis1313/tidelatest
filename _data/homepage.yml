    title: The Beautiful Lightness of Being
    description: >-
      Compromise is a part of life – except when you have a 108’, smart,
      comfortable Superyacht that simultaneously handles with the daintiness of
      a dinghy. The Skipper and owner of Kiboko 4 – just voted Sailing Yacht of
