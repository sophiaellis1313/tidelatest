  - image: >-
      /uploads/issue-12/tide-magazine-sailing-lifestyle-travel-issue12-hidden-gems-3.jpg
    alt: 'Hidden Gems: Islas Secas'
    link: articles/hidden-gems-islas-secas
    tags:
      - Travel
      - number 12
    title: 'Hidden Gems: Islas Secas'
    description: >
      Known to some as the Lost Coast, Panama’s Gulf of Chiriquí remains a wild
      stretch of Central America’s eastern tropical Pacific. A landscape of
      dozens of islands sewn from ancient volcanoes and some of the richest
      virgin coastal rainforest in the region, it’s a world unto its own, thanks
      to its isolated position and topography unfazed by El Niño’s colder winds
cards4:
  - image: /uploads/tide-magazine-sailing-lifestyle-travel-issue12-design-1.jpg
    alt: 'Designing for the Future   '
    link: articles/estudio-ramos.html
    tags:
      - Design
      - number 12
    title: 'Designing for the Future   '
    description: >-
      “Architecture is a little bit like music: it’s about rhythm, silences. We
      don’t want our architecture to be loud,” says Juan Ignacio Ramos, the
      figure behind Estudio Ramos, a 35-year-strong family-run firm with dual
      bases in New York City and Buenos Aires
  - image: /uploads/download.jpg
    alt: Expanding Horizons
    link: articles/expanding-horizons.html
    tags:
      - Design
      - Number 11
    title: Expanding Horizons
    description: >-
      When you spend time examining the landscape of yacht design, you start to
      observe that designers in the genre tend to fall into two distinct
      categories. On the one hand you have specialists who have always focused
      exclusively on spaces that sail, while others have come over from
      residential projects or commercial fields and grown to include yachts in
      their portfolios
  - image: >-
      /uploads/issue09/tide-magazine-sailing-lifestyle-travel-issue09-design-jarkko-1.jpg
    alt: ''
    link: articles/design-jarkko
    tags:
      - design
      - number 09
    title: Changing the Game
    description: >-
      You don’t simply emerge from the woods and set to work designing a boat as
      radical and demanding as Baltic’s new 111ft super-speedster Raven. So, if
      you haven’t heard the name Jarkko Jämsén before, it is perhaps because of
      a certain Finnish modesty, as well as a track record in motorboats. This
      foiling fantasy may be his first sailing boat, but make no mistake: it
      will not be his last
  - image: /uploads/download-2.jpg
    alt: The View From Here
    link: articles/design-mckeon
    tags:
      - design
      - number 08
    title: The View From Here
    description: >+
      It was McKeon’s mother, an artist herself, who first taught him the
      importance of aesthetics and proportion, something that runs across the
      blueprint of all design, but plays particular importance in naval
      architecture. Another takeaway was the importance of how a creation is
      perceived as a whole, and to this day McKeon’s designs are acclaimed for
      that magic three: their artistic look, skillful dimensions and clean
      exterior lines

