      Sailing Collective charters, Dayyan Armstrong shares the local intel.

cards2:
  - image: /uploads/jeff-brown-jcb24539-min.jpg
    alt: A Perfect Re(fit)
    link: articles/A-Perfect-refit.html
    tags:
      - Sailing
      - number 13
    title: A Perfect Re(fit)
    description: >
      What are the benefits and pitfalls of having a yacht refresh, and where
      should you go? Miriam Cain talks to various experts, including the people
      behind Ravenger, winner of the refit category at this year’s World
      Superyacht Awards, to find out.
  - image: >-
      /uploads/issue-12/tide-magazine-sailing-lifestyle-travel-issue12-sarissa-1.jpg
    alt: ' On Point:  Supersloop Sarissa '
    link: /articles/sarissa
    tags:
      - Sailing
      - number 12
    title: ' On Point:  Supersloop Sarissa '
    description: ' The 60m Sarissa, named after the ancient Greek word for a long, sharp spear, is cutting-edge in every way, from her record-holding square-top mainsail to her impressive speed and unique quietness. We meet her designer Malcolm McKeon and Captain Iain Cook to find out her secret '
  - image: >-
      /uploads/issue-11/tide-magazine-sailing-lifestyle-travel-issue11-wind-4.jpg
    alt: Wind is Power
    link: /articles/Drumfire-the-boat-to-beat%20.html
    tags:
      - Sailing
      - number 11
    title: Wind is Power
    description: >
      The latest rig and sail innovations are allowing boatbuilders and
      designers to think big when it comes to sailing vessels – and that could
      be good news for the environment.
  - image: /uploads/dsc01506-1-min-1.jpg
    alt: https://peachy-lion.cloudvent.net/articles/Wider-wake.html
    link: ''
    tags:
      - ''
    title: Wider Wake
    description: >
      High speed multihulls have the ability to broaden your horizons in the
      most extraordinary way. Sea Tilt, a Gunboat 68, is a case in point.
cards3:
  - image: /uploads/makris-fine-dining-restaurant-2.jpg
    alt: 'The High Low: The Greek Islands'
    link: articles/The-High-Low-the-Greek-Islands%20.html
    tags:
      - Travel
      - number 13
    title: 'The High Low: The Greek Islands'
    description: >-
      Wherever you find yourself on Greece’s islands, the range of epicurean
      temptations is seemingly limitless. Sailors have long been drawn to the
      calm, sapphire waters of the Ionian Sea, dropping anchor in protected
      coves that scallop the coastlines of places like Corfu, Kefalonia and
      Ithaki. 
  - image: /uploads/image00014.jpeg
    alt: 'Checking In: Skinopi Lodge'
    link: articles/Checking-in-Skinopi-Lodge%20.html
    tags:
      - Travel
      - number 13
    title: 'Checking In: Skinopi Lodge'
    description: >+
      Go back to soothingly simpler times in comfort via a stay at one of these
      eco-chic boathouse-villas, located on arguably the most stunning of all
      the Cyclades islands. Owner Nausika Georgiadou gives us the downlow.

  - image: >-
      /uploads/issue-12/tide-magazine-sailing-lifestyle-travel-issue12-hidden-gems-3.jpg
    alt: 'Hidden Gems: Islas Secas'
    link: articles/hidden-gems-islas-secas
    tags:
      - Travel
      - number 12
    title: 'Hidden Gems: Islas Secas'
    description: >
      Known to some as the Lost Coast, Panama’s Gulf of Chiriquí remains a wild
      stretch of Central America’s eastern tropical Pacific. A landscape of
      dozens of islands sewn from ancient volcanoes and some of the richest
      virgin coastal rainforest in the region, it’s a world unto its own, thanks
      to its isolated position and topography unfazed by El Niño’s colder winds.
  - image: /uploads/dodecanese-tide-mag-dja-87-1-min-1.jpg
    alt: ''
    link: /articles/Sailing-the-Northern-Dodecanese.html
    tags:
      - ''
    title: Sailing the Northern Dodecanese
    description: >+
      Welcome to the top of the “twelve islands”, an archipelago revered for its
      storied past, secret bays and sense of discovery. Director and founder of
      Sailing Collective charters, Dayyan Armstrong shares the local intel.

cards4:
  - image: /uploads/tide-magazine-sailing-lifestyle-travel-issue12-design-1.jpg
    alt: 'Designing for the Future   '
    link: articles/estudio-ramos.html
    tags:
      - Design
      - number 12
    title: 'Designing for the Future   '
    description: >-
      “Architecture is a little bit like music: it’s about rhythm, silences. We
      don’t want our architecture to be loud,” says Juan Ignacio Ramos, the
      figure behind Estudio Ramos, a 35-year-strong family-run firm with dual
      bases in New York City and Buenos Aires.
  - image: /uploads/download.jpg
    alt: Expanding Horizons
    link: articles/expanding-horizons.html
    tags:
      - Design
      - Number 11
    title: Expanding Horizons
    description: >-
      When you spend time examining the landscape of yacht design, you start to
      observe that designers in the genre tend to fall into two distinct
      categories. On the one hand you have specialists who have always focused
      exclusively on spaces that sail, while others have come over from
      residential projects or commercial fields and grown to include yachts in
      their portfolios. 
  - image: >-
      /uploads/issue09/tide-magazine-sailing-lifestyle-travel-issue09-design-jarkko-1.jpg
    alt: ''
    link: articles/design-jarkko
    tags:
      - ''
    title: Changing the Game
    description: >-
      You don’t simply emerge from the woods and set to work designing a boat as
      radical and demanding as Baltic’s new 111ft super-speedster Raven. So, if
      you haven’t heard the name Jarkko Jämsén before, it is perhaps because of
      a certain Finnish modesty, as well as a track record in motorboats. This
      foiling fantasy may be his first sailing boat, but make no mistake: it
      will not be his last.
cards5:
  - image: /uploads/environment-example-2-3.png
    alt: The Force of Nature
    link: articles/pianosa
    tags: []
    title: The Force of Nature
    description: >-
      On the island of Pianosa, surrounded by the vividly cerulean waves of the
      Tyrrhenian Sea, there is an empty prison. The isle is a relatively small
      piece of land – just a little more than ten square kilometres – and
      noticeably flat, with a maximum elevation of 29 metres above sea level.
  - image: /uploads/environment-example-1.png
    alt: A Letter From Norway
    link: articles/letter-from-norway.html
    tags:
      - ''
    title: A Letter From Norway
    description: >
      Pale, sunny yellow buildings dance on the surface of the dark, calm water;
      a gap, then its neighbour, white, moves in a chaotic sort of synchrony
      with it. The next, a rosy pink, is a little harder to make out, but adds
      to the kaleidoscope of colour that cheers up the otherwise grey autumn sky
      in Ålesund, a pretty port town on the west coast of Norway.
  - image: /uploads/tide-magazine-sailing-lifestyle-travel-issue05-environment1.jpg
    alt: The Winds of Change
    link: articles/veer.html
    tags:
      - Environmental
      - Number 05
    title: The Winds of Change
    description: >-
      In a world grappling with the early devastating effects of a warming
      climate, the maritime world stands apart as an oft-overlooked contributor.
      Out at sea, away from critical eyes, marine transport has long exerted a
      significant impact on the environment, often hidden beneath the surface of
      economic growth.
