      - Number 13
    title: The Beautiful Lightness of Being
    description: >-
      Compromise is a part of life – except when you have a 108’, smart,
      comfortable Superyacht that simultaneously handles with the daintiness of
      a dinghy. The Skipper and owner of Kiboko 4 – just voted Sailing Yacht of
      2025 – explain how she does it
  - image: /uploads/dodecanese-tide-mag-dja-87-1.jpg
    alt: Sailing the Northern Dodecanese
    link: articles/Sailing-the-Northern-Dodecanese.html
    tags:
      - travel
      - Number 13
    title: Sailing the Northern Dodecanese
    description: >+
      Welcome to the top of the “twelve islands”, an archipelago revered for its
      storied past, secret bays and sense of discovery. Director and founder of
      Sailing Collective charters, Dayyan Armstrong shares the local intel

  - image: /uploads/download-14.jpg
    alt: ''
    link: articles/project-o
    tags:
      - Travel
      - Number 11
    title: 'Hidden Gems: Project Ö, Skjulskäret'
    description: >-
      Those few days alone on tiny Skjulskäret, a measle of granite and gneiss
      among the 40,000 or so islands of the Finnish archipelago, feel like a
      reverie now. The slow days my partner and I spent in the gable-roofed,
      Monopoly-esque timber house of Project Ö (“Project Island”): cooking beef
      and foraged mushroom pot pies; exploring our rocky, forested little
      universe; watching spiders weave jewel-drop webs that wobbled in the same
      winds that whooshed over the sea, where the Gulf of Bothnia meets the Gulf
      of Finland and the Baltic Sea
