content_on_image:
  image: /uploads/modernism-desktop.png
  alt: Evolving Modernism
  tags:
    - Design
    - Number 12
  title: Evolving Modernism
  description: >-
    “Architecture is a little bit like music: it’s about rhythm, silences. We
    don’t want our architecture to be loud,” says Juan Ignacio Ramos, the figure
    behind Estudio Ramos, a 35-year-strong family-run firm with dual bases in
    New York City and Buenos Aires. Despite their desire not to “scream
    anything” with their work, Ramos and his son and partner, Ignacio Ramos,
    have certainly caught the design world’s attention.
  button:
    text: More
    link: /articles/estudio-ramos.html
    class: width-fit btn white-btn
