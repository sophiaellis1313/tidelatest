      title: From Land to Sea
      description: >+
        Forward-thinking shipyards and owners are becoming increasingly creative
        and inviting designers from outside the yachting industry to make their
        mark on board. One such example is Swedish architectural firm Andreas
        Martin-Löf Arkitekter. Well-known for its high-end residential projects,
        the Stockholm-based design firm has more recently also turned its hand
        to a few yacht interiors, including Baltic’s latest delivery, ZEMI.

