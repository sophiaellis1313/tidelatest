title: Terms & Conditions
intro: >-
  Thank you for visiting our site and shopping with TIDE. Here is a list of
  details you'll need to know before browsing our site and placing an order with
  us.
sections:
  - heading: COPYRIGHT & USAGE
    content: >
      You are welcome to use the product photos from our online shop page and
      site, as long as you properly credit TIDE Magazine and link back to our
      homepage or the product page. Photos may not be used for any other purpose
      and may not be altered. All content on this website is copyrighted. High
      resolution product photos are available upon request at
      editor@tide-magazine.com.
  - heading: PAYMENT
    content: >
      We are currently accepting payment via debit/credit card, as well as
      Paypal. To use a debit or credit card, simply enter your card information
      when prompted, and your account will be securely charged.
  - heading: SHIPPING
    content: >
      To see detailed information about Shipping, view our <a
      href="/shipping">Shipping Policy</a>.
  - heading: RETURNS
    content: >
      At this time, we do not offer returns or exchanges. If you are unsatisfied
      with your order within 7 days of receiving your package, please contact us
      at editor@tide-magazine.com.
  - heading: DUTIES/TAXES
    content: >
      International packages may incur taxes/duties. Please familiarise yourself
      with your country’s fees before placing an order. TO THE SEA MEDIA Ltd is
      legally obligated to enter the full value of orders on customs forms.
  - heading: CANCELLATIONS
    content: >
      We will try our best to fulfil every order as specified in our terms, but
      delays and cancellations may occur for reasons beyond our control. We
      reserve the right to cancel any orders for any reason, refunding our
      customers for the full amount immediately.
  - heading: ASSISTANCE
    content: >
      For any further assistance, please get in touch at
      editor@tide-magazine.com.
