    title: The Pursuit Superyacht Invitational
    description: The North American island nation...
    popup_title: The Pursuit Superyacht Invitational 2026
    popup_date: FEBRUARY 26TH-28TH, 2026
    popup_name: ANTIGUA & BARBUDA
    popup_description: >-
      At the end of February 2026, the waters between Antigua and Barbuda will
      come alive. Ten of the world’s finest Superyachts will slice through the
      Caribbean seas, during a very special addition to the winter sailing
      calendar. The TIDE Collective, the editorial brand’s new experiences arm,
      in partnership with dunhill, Hermitage Bay and Nobu Barbuda, is hosting
      its first immersive event: The Pursuit Superyacht Invitational.
    popup_description2: >-
      The first of a fresh series of race weekends, the focus is on pairing the
      thrill of competitive sailing equally with the camaraderie that’s so
      innate to the sport, alongside the barefoot luxe appeal of the Super
      lifestyle. How? By combining the Corinthian format – a race system
      structured to accommodate varied yacht classes while sustaining an
      exciting sense of competition – with a well-planned itinerary that allows
      plenty of room to kick back with old and new acquaintances, alongside
      access to some of the most beautiful beaches in existence. With space for
      just 10 boats on an invite-only basis, this is a unique chance for yacht
      owners, their crew and guests to celebrate their shared passion for the
      ocean and adventure together, on this memory-making weekend. The event’s
      next-level luxe is also embedded from launch by its connection with the
      region’s chicest, most coveted locations. Hermitage Bay, set over 140
      highly secluded Antiguan acres, has been described by TIDE as “poised to
      redefine what travellers can expect from a Caribbean retreat.” Its recent
      multimillion-pound refurb and sensitive landscape upgrade has been steered
      by new owner Daniel Shamoon of Luxury Hotels Partners (LHP). Along with 30
      redecorated wooden cottages that now feature more modern amenities plus
      larger terraces and individual pools, there’s more local produce on the
      restaurant menu (as shaped by Executive Chef Liam Smith, one of the
      originals from London’s La Petite Maison) and a fresh tree-side beach bar
      that serves sushi. Shamoon is also co-owner of The Pursuit’s other
      destination: Nobu Barbuda on Antigua’s twin island. Looking out onto
      sprawling white- and pink-sand beaches, lagoons rich with untouched
      wildlife and the lapping Caribbean waters, the coral isle of Barbuda
      itself is by nature nothing short of dreamy. Open since 2020, Nobu
      Barbuda’s Japanese-Peruvian dishes attract visitors by boat and chopper
      from around the globe, as well as loyal locals from the island. Its
      success has inspired the late 2025 opening of Nobu Beach Inn on Princess
      Diana Beach, set to include two- and three-bedroom bungalows encircled by
      gardens and pools, all designed to smoothly blend into the surrounding
      Caribbean coast and landscape. The itinerary Thursday 26 February 2026
      Yacht arrival and anchor off Hermitage Bay 17:00-20:00 Opening evening and
      welcome Friday 27 February 2026 10:00 Owners and Captain’s briefing 11:30
      Race start 15.30 Finish line at Hermitage Bay 17:00 Sunset drinks 19:00
      Dinner Saturday 28 February 2026 10:00 Owners and Captain’s briefing 11:30
      Race Start 14:30 Finish line off Princess Diana Beach, Barbuda 15:30
      Tender transfer to Nobu Barbuda - Welcome Drink 16:00 Late afternoon Lunch
      at Nobu Barbuda Beach Club and Sunset Omakase – Music, Entertainment and
      presentation of ‘The Jacket’ to the winning owner, plus the Sushi Sword
      Trophy 20:00 End: option to stay in Barbuda, sail back to Hermitage Bay
      Limited positions available; early expression of interest advised. Contact
      Founder and Editor-in-Chief Garry Maidment on garry@tide-magazine.com for
      more information
    popup_button_label: READ MORE
    popup_button_label2: CONTACT FOR MORE INFO
    popup_button_link2: mailto:garry@tide-magazine.com
  - image: /uploads/tidepoli-min-1.png
    alt: TIDE Polo + St Tropez
    link: /articles/itinerary-cuba
    tags:
      - St. Tropez
      - JULY 16TH
    title: Three's a Charm
    description: The day Marie-Louise Sciò...
    popup_title: >-
      TIDE Polo + St Tropez : Announcing Our Inaugural Collaboration with Polo
      Club Saint Tropez + TIDE Polo
    popup_date: 2026-07-01T05:30:00+05:30
    popup_name: ST. TROPEZ
    popup_description: >-
      We are thrilled to announce that The TIDE Collective is officially
      launching, and we're making waves with our very first event collaboration
      alongside two prestigious partners: Polo Club Saint Tropez and TIDE Polo.
      This marks the beginning of an exciting journey as we bring together
      luxury, sport, sustainability, and community in one of the world's most
      iconic coastal destinations.Riding Into Port: A Perfect Partnership
    popup_description2: >-
      As The TIDE Collective drops anchor, we couldn't have chosen better
      partners to inaugurate our mission. Polo Club Saint Tropez represents the
      pinnacle of elegance and sporting excellence on the French Riviera, while
      TIDE Polo show cases woman’s Polo and environmental consciousness in the
      world of equestrian sport. Together, we're creating an experience that
      transcends traditional event boundaries—one that celebrates the
      intersection of lifestyle and athleticism. Our inaugural event will
      showcase the best of what happens when passion meets purpose. Attendees
      will experience world-class polo action, exclusive networking
      opportunities, and a celebration of the lifestyle win sport that defines
      both Saint Tropez and The TIDE Collective's ethos. This is more than just
      a sporting event—it's the beginning of a movement that brings together
      athletes and animals, entrepreneurs, and visionaries who believe in making
      a positive impact.
    popup_button_label: READ MORE
    popup_button_label2: CONTACT FOR MORE INFO
    popup_button_link2: mailto:garry@tide-magazine.com
