  - image: /uploads/tidepoli-min-1.png
    alt: TIDE Polo + St Tropez
    link: /articles/itinerary-cuba
    tags:
      - St. Tropez
      - JULY 16TH
    title: TIDE Polo + St Tropez
    description: >
      We are thrilled to announce that The TIDE Collective is officially
      launching, and we're making waves with our very first event collaboration
      alongside two prestigious partners: Polo Club Saint Tropez and TIDE Polo.
      This marks the beginning of an exciting journey as we bring together
      luxury, sport, sustainability, and community in one of the world's most
      iconic coastal destinations.

      Riding Into Port: A Perfect Partnership

      As The TIDE Collective drops anchor, we couldn't have chosen better
      partners to inaugurate our mission. Polo Club Saint Tropez represents the
      pinnacle of elegance and sporting excellence on the French Riviera, while
      TIDE Polo show cases woman’s Polo and environmental consciousness in the
      world of equestrian sport. Together, we're creating an experience that
      transcends traditional event boundaries—one that celebrates the
      intersection of lifestyle and athleticism.

      Our inaugural event will showcase the best of what happens when passion
      meets purpose. Attendees will experience world-class polo action,
      exclusive networking opportunities, and a celebration of the lifestyle win
      sport that defines both Saint Tropez and The TIDE Collective's ethos. This
      is more than just a sporting event—it's the beginning of a movement that
      brings together athletes and animals, entrepreneurs, and visionaries who
      believe in making a positive impact.
    popup_title: >-
      TIDE Polo + St Tropez : Announcing Our Inaugural Collaboration with Polo
      Club Saint Tropez + TIDE Polo
