featured_section:
  cards:
    - image: /uploads/tide-magazine-sailing-lifestyle-travel-issue10-gunboat-2-1.jpg
      alt: ' Building a Brand: Gunboat '
      link: /articles/gunboat
      tags:
        - ' Sailing '
        - number 10
      title: ' Building a Brand: Gunboat '
      description: ' Few boatbuilders out there can claim to have changed the face of yachting. Gunboat is one of them. Rodolphe Cadoret, Marketing Director for the brand’s owners Grand Large, explains why and how they did it, and hints at what they may revolutionise next    '
    - image: /uploads/tide-magazine-sailing-lifestyle-travel-issue10-kokomo-4.jpg
      alt: ' A Sailing Legacy Kokomo '
      link: /articles/kokomo
      tags:
        - ' Sailing '
        - number 10
      title: ' A Sailing Legacy Kokomo '
      description: ' Super-sized, fast and sleek – this is the story of a Superyacht born from two legendary minds and one historic yard; a story which isn’t ending any time yet. We get the inside track from her current owner and Captain   '
    - image: /uploads/tide-magazine-sailing-lifestyle-travel-issue09-velsheda-1.jpg
      alt: ' Sailing Vel-She-Da '
      link: /articles/velsheda
      tags:
        - ' Sailing '
        - number 09
      title: ' Sailing Vel-She-Da '
      description: ' Velsheda is one of only three survivors of the prestigious 1930s boat group – here her skipper of 10 years Barney Henshaw-Depledge shares what she’s like to handle today '
    - image: >-
        /uploads/tide-magazine-sailing-lifestyle-travel-issue09-oceans-twelve-1.jpg
      alt: ' Ocean’s Twelve '
      link: /articles/oceans-twelve
      tags:
        - ' Sailing '
        - number 09
      title: ' Ocean’s Twelve '
      description: ' Famed for their beauty as well as their brawn, Twelve Metre Class yachts were a result of leading designers being put into the tightest of spots – and flourishing. Here we highlight some of the very finest  '
  cards2:
    - image: /uploads/tide-magazine-sailing-lifestyle-travel-issue09-raven-1.jpg
      alt: ' As The Raven Flies '
      link: /articles/raven
      tags:
        - ' Sailing'
        - number 09
      title: ' As The Raven Flies '
      description: ' Introducing the pioneering racing Superyacht that’s redefining today’s boating limitations – and the many minds that brought it into being '
    - image: /uploads/tide-magazine-sailing-lifestyle-travel-issue08-ribelle-6.jpg
      alt: 'Ribelle with a cause '
      link: /articles/ribelle
      tags:
        - ' Sailing'
        - number 08
      title: 'Ribelle with a cause '
      description: ' Even at seven years old, this 33m lightweight Superyacht remains a masterclass in boat-craft. Here, her Skipper and creator share what makes – and keeps – her a cut above '
    - image: /uploads/tide-magazine-sailing-lifestyle-travel-issue08-asahi-3.jpg
      alt: ' Asahi''s Secret '
      link: /articles/asahi
      tags:
        - ' Sailing '
        - number 08
      title: ' Asahi''s Secret '
      description: ' Captain Angus Biffin and his crew reveal the endless passion and meticulous processes that go on behind the scenes to ensure the yacht charter is equally magical and unique for every client that steps onboard  '
    - image: /uploads/tide-magazine-sailing-lifestyle-travel-issue08-two-owners-2.jpg
      alt: ' A Tale of Two Owners '
      link: /articles/two-owners
      tags:
        - ' Sailing'
        - ' number 08'
      title: ' A Tale of Two Owners '
      description: ' Every yacht has a yarn to tell, but with both these especially beautiful, traditional-yet-contemporary examples, it’s more joyful than usual – thanks, in no small part, to the love bestowed on them by their owners '
  cards3:
    - image: >-
        /uploads/tide-magazine-sailing-lifestyle-travel-issue07-wendys-house1.jpg
      alt: ' Wendy’s House: Elfje '
      link: /articles/wendys-house
      tags:
        - ' Sailing'
        - number 07
      title: ' Wendy’s House: Elfje '
      description: ' Sometimes the joy is almost as much in the journey when creating a beautiful boat. Here, we find out the unique path that American philanthropist Wendy Schmidt’s primary Superyacht took into being '
    - image: /uploads/tide-magazine-sailing-lifestyle-travel-issue07-canova2.jpg
      alt: ' Creating Canova '
      link: /articles/canova
      tags:
        - Sailing
        - number 07
      title: ' Creating Canova '
      description: ' What happens when a Superyacht owner refuses to compromise during the design and creation process? Baltic Yachts, designer Guiseppe Martines and Bruce Farr’s team took on the challenge with outstanding results. But was the man behind the initial vision satisfied? We investigate  '
    - image: /uploads/tide-magazine-sailing-lifestyle-travel-issue07-gelliceaux1.jpg
      alt: ' A Green Revolution: Gelliceaux '
      link: /articles/gelliceaux
      tags:
        - 'Sailing I '
        - number 07
      title: ' A Green Revolution: Gelliceaux '
      description: ' With Gelliceaux, Southern Wind has successfully created a boat that is almost as sustainable as it is stylish. Here we explore how   '
    - image: /uploads/tide-magazine-sailing-lifestyle-travel-issue06-athos2.jpg
      alt: 'The Seas Less Sailed '
      link: /articles/athos
      tags:
        - ' Sailing '
        - number 06
      title: 'The Seas Less Sailed '
      description: |2-
         Sailors dream of going off-grid – but few have achieved it so comprehensively 
        as SY Athos on her recent summer cruise through British Columbia. 
        Skipper Tony Brookes and photographer Oli Riley recount the highlights 
  cards4:
    - image: /uploads/tide-magazine-sailing-lifestyle-travel-issue06-batic-682.jpg
      alt: ' Take Two '
      link: /articles/baltic-68
      tags:
        - ' Sailing'
        - number 06
      title: ' Take Two '
      description: |2-
         Baltic Yachts created quite a stir when it launched its 68 Café Racer, Pink Gin Verde. Now hull number two, Open Season, 
        is on the water and the devil is in the difference 
    - image: /uploads/tide-magazine-sailing-lifestyle-travel-issue05-why-not1.jpg
      alt: ' Why Not! '
      link: /articles/why-not
      tags:
        - Sailing
        - number 05
      title: ' Why Not! '
      description: ' Y Yacht’s Y9 is the brainchild of German maverick Michael Schmidt, a pure sailor. His devotion shines through in his latest boat. '
    - image: /uploads/tide-magazine-sailing-lifestyle-travel-issue05-sea-eagle1.jpg
      alt: 'The Eagle Has Landed '
      link: /articles/the-eagle
      tags:
        - Sailing I
        - number 05
      title: 'The Eagle Has Landed '
      description: ' All the headlines around the 81m schooner Sea Eagle inevitably involve flying puns. She was ‘spreading her wings’ when she was shipped out of Royal Huisman’s Vollenhove yard in January 2020. And she was said to be ‘soaring’ when stunning new pictures of her cruising in French Polynesia were released recently. Fascinating, then, that the man for whom the yacht was actually built reportedly never once sailed her. '
    - image: /uploads/tide-magazine-sailing-lifestyle-travel-issue05-ghosted1.jpg
      alt: ' Ghosted: In Good Company '
      link: /articles/ghosted
      tags:
        - Sailing I
        - number 05
      title: ' Ghosted: In Good Company '
      description: ' True to her name, 37m Vitters sloop Ghost keeps a low profile. Sam Fortescue catches up with Michael “Hutch” Hutchison, her captain for the last 16 years, to learn more. '
  cards5:
    - image: /uploads/tide-magazine-issue04-two-ketches-2-1.jpg
      alt: ' A Tale of  Two Ketches '
      link: /articles/two-ketches
      tags:
        - Sailing
        - number 04
      title: ' A Tale of  Two Ketches '
      description: ' As Vitters launch another ketch of extraordinary proportions this summer, TIDE looks back on Adele, who broke the mould 20 years ago and still turns heads today. '
    - image: /uploads/tide-magazine-issue04-pot-of-gold-4-1.jpg
      alt: ' A Pot of Gold: J Class Rainbow '
      link: /articles/a-pot-of-gold
      tags:
        - 'Sailing '
        - number 04
      title: ' A Pot of Gold: J Class Rainbow '
      description: ' The original ‘super’ yacht, the J-Class may be a throwback to the golden age of sailing, but these titans of the sea continue to turn heads as they carve through the waves with grace and power. As the J-Class racing scene gathers momentum in the lead up to the 2024 World Championship, TIDE takes a look behind the lens of one of the most beautiful modern-day J-Class yachts, the 131ft (39.95m) Rainbow '
    - image: /uploads/fs-h8yzu-2.jpg
      alt: 'A Touch of Nordic Cool - Sørvind '
      link: /articles/a-touch-of-nordic-cool-sorvind
      tags:
        - 'Sailing '
        - number 03
      title: 'A Touch of Nordic Cool - Sørvind '
      description: ' With the latest yachts on show in Monaco, TIDE checks in with South African yacht builder Southern Wind to take a close look at their new launch, Sørvind. '
    - image: /uploads/deiz3z3k.jpg
      alt: 'Nautor Swan: Innovating through tradition '
      link: /articles/nautor-swan
      tags:
        - ' Sailing '
        - number 03
      title: 'Nautor Swan: Innovating through tradition '
      description: ' Redefining high-performance cruising, the new generation of Swan 98 offers speed and luxury. Just as comfortable crossing oceans as hopping between shallow tropical islands, racing around headlands or navigating the fjords, the Finnish-built yachts are widely touted as the best of all worlds. TIDE speaks with Nautor Swan’s team to find out what the 98 is all about. '
cards6:
  - image: /uploads/glclzrga-1.jpg
    alt: ' A Global Range: The Schooner '
    link: /articles/a-global-range-the-schooner
    tags:
      - ' Sailing'
      - number 03
    title: ' A Global Range: The Schooner '
    description: ' With the forthcoming re-launch of ATHOS, we take a look at some of the most famous Schooners afloat today, and show how the multi-mast sailing yachts are hard to beat for a truly authentic sailing experience. '
  - image: /uploads/lsr8twys.jpg
    alt: ' A True Classic '
    link: /articles/a-true-classic
    tags:
      - Sailing
      - number 01
    title: ' A True Classic '
    description: ' Invoking memories of a bygone era, the charm of the Truly Classic 128 has been proven by the realisation of four builds (and a fifth on its way). TIDE explores the success of the concept with Hoek Design and hears from the owners of the second hull in the series about the joy that Vijonara brings. '
  - image: /uploads/qhxzfote.jpg
    alt: 'The Pocket Superyacht '
    link: /articles/the-pocket-superyacht
    tags:
      - 'Sailing '
      - number 02
    title: 'The Pocket Superyacht '
    description: ' Superyacht is an evocative word-enormous craft with lofty rigs and loftier budgets, fully customised, complex creations. But the core values of what make a superyacht (luxury, style and personal expression)are not the sole preserve of custom vessels well in excess of24m....let’s take a look at the pocket superyacht. '
  - image: /uploads/tide-magazine-sailing-sorvind-1-1.jpg
    alt: ' A Touch of Nordic Cool - Sørvind '
    link: /articles/sorvind
    tags:
      - 'Sailing I '
      - Number 03
    title: ' A Touch of Nordic Cool - Sørvind '
    description: ' With the latest yachts on show in Monaco, TIDE checks in with South African yacht builder Southern Wind to take a close look at their new launch, Sørvind. '
  - image: /uploads/deiz3z3k.jpg
    alt: ' A Global Range: The Schooner '
    link: /articles/schooner
    tags:
      - Sailing
      - Number 03
    title: ' A Global Range: The Schooner '
    description: ' With the upcoming launch of 63m Athos, TIDE takes a look at some of the most famous schooners afloat today. Inspired by both past and future, these multi-mast vessels are hard to beat for a truly authentic sailing experience. '
  - image: /uploads/tide-magazine-sailing-sonny-5-1.jpg
    alt: ' The Adventure Squad '
    link: /articles/sonny
    tags:
      - ' Sailing'
      - number 02
    title: ' The Adventure Squad '
    description: ' When time is the ultimate luxury, what does a $2.5 million refurbishment of a sailing yacht look like? Patrick Gavin-Brynes, captain of the newly re-launched Sonny III, talks hydraulic systems, custom carbon-fibre rigging and hoisting 192 square metres of sail in under 60 seconds '
  - image: /uploads/tide-magazine-sailing-perseverance-3-1.jpg
    alt: ' Perseverance on Charter '
    link: /articles/perseverance
    tags:
      - Sailing
      - number 02
    title: ' Perseverance on Charter '
    description: ' The price put on superyacht charters is famously opaque, with unexpected add-ons making it hard to predict how much you’ll spend. Bypassing brokers and agents, the owners of Perseverance are taking a different approach, bringing bespoke yet all-inclusive packages to the ultra-luxury sphere. '
