    title: A Perfect Re(fit)
    description: >+
      What are the benefits and pitfalls of having a yacht refresh, and where
      should you go? Miriam Cain talks to various experts, including the people
      behind Ravenger, winner of the refit category at this year’s World
      Superyacht Awards, to find out.


