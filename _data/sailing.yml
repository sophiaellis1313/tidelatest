featured_section:
  cards:
    - image: >-
        /uploads/issue-10/tide-magazine-sailing-lifestyle-travel-issue10-maximus-1.jpg
      alt: Maximus The Ocean Gladiator
      link: articles/maximus
      tags:
        - sailing
        - number 10
      title: Maximus The Ocean Gladiator
      description: >+
        You might have thought that the era of watching men battle for sport
        died with the Romans. But you’d be wrong. Last year, Vitters shipyard
        delivered a striking 59m ketch that has been tearing up the yachting
        racecourse ever since. This is the story of Maximus, a gladiator of our
        times.

    - image: /uploads/tide-magazine-sailing-lifestyle-travel-issue10-gunboat-2-1.jpg
      alt: ' Building a Brand: Gunboat '
      link: /articles/gunboat
      tags:
        - ' Sailing '
        - number 10
      title: ' Building a Brand: Gunboat '
      description: ' Few boatbuilders out there can claim to have changed the face of yachting. Gunboat is one of them. Rodolphe Cadoret, Marketing Director for the brand’s owners Grand Large, explains why and how they did it, and hints at what they may revolutionise next    '
    - image: /uploads/tide-magazine-sailing-lifestyle-travel-issue10-kokomo-4.jpg
      alt: ' A Sailing Legacy Kokomo '
      link: /articles/kokomo
      tags:
        - ' Sailing '
        - number 10
      title: ' A Sailing Legacy Kokomo '
      description: ' Super-sized, fast and sleek – this is the story of a Superyacht born from two legendary minds and one historic yard; a story which isn’t ending any time yet. We get the inside track from her current owner and Captain   '
    - image: /uploads/tide-magazine-sailing-lifestyle-travel-issue09-velsheda-1.jpg
      alt: ' Sailing Vel-She-Da '
      link: /articles/velsheda
      tags:
        - ' Sailing '
        - number 09
      title: ' Sailing Vel-She-Da '
      description: ' Velsheda is one of only three survivors of the prestigious 1930s boat group – here her skipper of 10 years Barney Henshaw-Depledge shares what she’s like to handle today '
    - image: >-
        /uploads/tide-magazine-sailing-lifestyle-travel-issue09-oceans-twelve-1.jpg
      alt: ' Ocean’s Twelve '
      link: /articles/oceans-twelve
      tags:
        - ' Sailing '
        - number 09
      title: ' Ocean’s Twelve '
      description: ' Famed for their beauty as well as their brawn, Twelve Metre Class yachts were a result of leading designers being put into the tightest of spots – and flourishing. Here we highlight some of the very finest  '
    - image: >-
        /uploads/issue08/tide-magazine-sailing-lifestyle-travel-issue08-ribelle-6.jpg
      alt: Ribelle with a cause
      link: articles/ribelle
      tags:
        - sailing
        - number 08
      title: Ribelle with a Cause
      description: >+
        Designing a beautiful yacht takes more than just technical nous; the
        naval architect must master the fine art of achieving equilibrium. That
        delicate precarious struggle between speed, comfort, style and
        practicality. The designer is always walking a tightrope as they try to
        find the magic formula. It’s a fine art and only a true artist can
        create a masterpiece.

    - image: >-
        /uploads/issue08/tide-magazine-sailing-lifestyle-travel-issue08-asahi-3.jpg
      alt: Asahi's Secret
      link: articles/asahi
      tags:
        - sailing
        - number 08
      title: Asahi's Secret
      description: >+
        What makes one charter sailing yacht more appealing than another? Is it
        the crew, amenities, food or destination? Or all of that, in equal
        measure? Whatever the exact recipe, the ketch-rigged 56-metre Perini
        Navi, Asahi, seems to have struck somewhere close to the right balance.
        Beginning life in 2009 with a renowned Ron Holland racing design and
        timeless Remi Tessier interiors, the award-winning boat is part of the
        56-metre sailing series. Today, she is fresh from an extensive refit and
        bringing a new lease of life to the Caribbean circuit. Fittingly, her
        name, translated from Japanese, means ‘morning sun’.

    - image: >-
        /uploads/issue08/tide-magazine-sailing-lifestyle-travel-issue08-two-owners-2.jpg
      alt: A Tale of Two Owners
      link: articles/two-owners
      tags:
        - sailing
        - number 08
      title: A Tale of Two Owners
      description: >+
        This is the story of a couple of boat-owning sailors, plus two designers
        and – the main characters and plot – two extraordinary yachts and the
        sailing pleasure they bring. One of these remarkable sloops was built in
        Turkey, the other in the Netherlands, but they both share a classic look
        that is allied to distinctly modern handling, courtesy of what could be
        called the Dutch school of design. And TIDE shot each of them sailing
        off Nelson’s Dockyard, Antigua.

    - image: >-
        /uploads/issue-07/tide-magazine-sailing-lifestyle-travel-issue07-wendys-house1.jpg
      alt: 'Wendy’s House: Elfje'
      link: articles/wendys-house
      tags:
        - sailing
        - number 07
      title: 'Wendy’s House: Elfje'
      description: >+
        Wendy Schmidt’s first sailing experience did little to foreshadow the
        role that boats would later come to play in her life. In fact, I can
        almost hear her shrugging when I ask her about it. “I have a memory from
        my childhood when I was nine years old,” she recounts. “We took a family
        trip to Bermuda – it was the only aeroplane trip we ever took. My three
        brothers were in the cockpit of a 20ft sailboat on some sort of tourist
        experience. I’m sitting behind – my head is tossed back and I’m super
        relaxed. I was having a different experience to them.”

    - image: >-
        /uploads/issue-07/tide-magazine-sailing-lifestyle-travel-issue07-canova2.jpg
      alt: Creating Canova
      link: articles/canova
      tags:
        - sailing
        - number 07
      title: Creating Canova
      description: >+
        “What does a sailing boat mean? It means freedom,” the owner of
        Superyacht Canova muses. “But that freedom isn’t there if your boat
        doesn’t work for your purposes. Then a boat is the opposite; it doesn’t
        set you free, it is a burden.”

    - image: >-
        /uploads/issue-07/tide-magazine-sailing-lifestyle-travel-issue07-gelliceaux1.jpg
      alt: 'A Green Revolution: Gelliceaux'
      link: articles/gelliceaux
      tags:
        - sailing
        - number 07
      title: 'A Green Revolution: Gelliceaux'
      description: >+
        The green revolution within the boat-building industry continues apace
        with the launch of Southern Wind’s Smart Custom 108. This is hull number
        one in this range of high-performance luxury cruisers from the South
        African yard and the first boat they have built that has been
        specifically conceived and engineered for hybrid diesel-electric
        propulsion. The results are compelling.

    - image: >-
        /uploads/issue-06/tide-magazine-sailing-lifestyle-travel-issue06-athos2.jpg
      alt: The Seas Less Sailed
      link: articles/athos
      tags:
        - sailing
        - number 06
      title: The Seas Less Sailed
      description: >+
        “That couldn’t be further from the case on this trip; the whole area is
        just packed with nature. You see bears, tons of whales and we’ve been
        catching lots of Ling cod, salmon, rockfish, pollock, yellow tail, black
        cod, crabs, prawns, squat lobster (especially delicious) and various
        other fish. We may be sailing a luxury yacht, but this is real
        ‘backwoods, living-off-the-sea’ stuff.”

    - image: >-
        /uploads/issue-05/tide-magazine-sailing-lifestyle-travel-issue05-why-not1.jpg
      alt: Why Not!
      link: articles/why-not
      tags:
        - sailing
        - number 05
      title: Why Not!
      description: >+
        Owning a yacht can be about so many things: often, the actual art of
        going sailing is not top of the list. Yet a boat like the Y9
        demonstrates precisely why it should be. In addition to being elegant
        and artfully furnished, this 97’ vessel has a habit of reminding you how
        joyous and vital the act of unfurling sails, pointing the bow towards
        the horizon and leaning into the wind can be.

    - image: >-
        /uploads/issue-05/tide-magazine-sailing-lifestyle-travel-issue05-sea-eagle1.jpg
      alt:
      link: articles/the-eagle
      tags:
        - sailing
        - number 05
      title: The Eagle Has Landed
      description: >+
        That’s already changing, with the advent of ambitious new owners who
        want to put the yacht through her paces. They’ve spent the winter in the
        Caribbean and have a programme of refit work to transform her into a
        family yacht. So, what better opportunity to delve back into the story
        of this undoubted masterpiece, quietly snuck out under the blanket of
        lockdown.

    - image: >-
        /uploads/issue-05/tide-magazine-sailing-lifestyle-travel-issue05-ghosted1.jpg
      alt: 'Ghosted: In Good Company'
      link: articles/ghosted
      tags:
        - sailing
        - number 05
      title: 'Ghosted: In Good Company'
      description: >+
        A long period in the hands of a very private owner and an even longer
        spell under a single captain probably has more to do with this than
        anything occult. With Michael “Hutch” Hutchinson’s hand on the helm for
        more than 16 years, Ghost quietly criss-crossed the globe, racking up
        experiences of which most can only dream. Now in the hands of a new
        owner and captain, she now begins a fresh chapter, and Hutch is at last
        able to talk about the yacht’s rare attributes.

    - image: /uploads/tide-magazine-issue04-two-ketches-2-1.jpg
      alt: all | sailing number 04 A Tale of Two Ketches
      link: articles/two-ketches
      tags:
        - sailing
        - number 04
      title: A Tale of Two Ketches
      description: >-
        Possessing both classic lines and thoroughbred racing credentials, a J
        in some ways epitomises the high romance of yachting. In fact, the
        J-Class era, from 1929 to 1939, is often referred to as the premier
        decade of Superyacht racing. Their designers could not have imagined
        then that well over one hundred years later, their creations would still
        be drawing admiring looks and causing Billionaires to swoon.
    - image: /uploads/tide-magazine-issue04-pot-of-gold-4-1.jpg
      alt: 'A Pot of Gold: J Class Rainbow'
      link: articles/a-pot-of-gold
      tags:
        - sailing
        - number 04
      title: 'A Pot of Gold: J Class Rainbow'
      description: >+
        Possessing both classic lines and thoroughbred racing credentials, a J
        in some ways epitomises the high romance of yachting. In fact, the
        J-Class era, from 1929 to 1939, is often referred to as the premier
        decade of Superyacht racing. Their designers could not have imagined
        then that well over one hundred years later, their creations would still
        be drawing admiring looks and causing Billionaires to swoon. Whether an
        original yacht which has been rebuilt for the modern-era, or replica
        incarnations reconstructed more recently from 1930s designs, a number of
        these magnificent vessels are still racing at a serious level in classic
        yacht regattas around the world. One such boat is the 2012-built replica
        J-Class Rainbow.

    - image: /uploads/glclzrga-1.jpg
      alt: ' A Global Range: The Schooner '
      link: /articles/a-global-range-the-schooner
      tags:
        - ' Sailing'
        - number 03
      title: ' A Global Range: The Schooner '
      description: ' With the forthcoming re-launch of ATHOS, we take a look at some of the most famous Schooners afloat today, and show how the multi-mast sailing yachts are hard to beat for a truly authentic sailing experience. '
    - image: /uploads/lsr8twys.jpg
      alt: ' A True Classic '
      link: /articles/a-true-classic
      tags:
        - Sailing
        - number 01
      title: ' A True Classic '
      description: ' Invoking memories of a bygone era, the charm of the Truly Classic 128 has been proven by the realisation of four builds (and a fifth on its way). TIDE explores the success of the concept with Hoek Design and hears from the owners of the second hull in the series about the joy that Vijonara brings. '
    - image: /uploads/tide-magazine-sailing-sorvind-1-1.jpg
      alt: ' A Touch of Nordic Cool - Sørvind '
      link: /articles/sorvind
      tags:
        - 'Sailing I '
        - Number 03
      title: ' A Touch of Nordic Cool - Sørvind '
      description: ' With the latest yachts on show in Monaco, TIDE checks in with South African yacht builder Southern Wind to take a close look at their new launch, Sørvind. '
    - image: /uploads/deiz3z3k.jpg
      alt: ' A Global Range: The Schooner '
      link: /articles/schooner
      tags:
        - Sailing
        - Number 03
      title: ' A Global Range: The Schooner '
      description: ' With the upcoming launch of 63m Athos, TIDE takes a look at some of the most famous schooners afloat today. Inspired by both past and future, these multi-mast vessels are hard to beat for a truly authentic sailing experience. '
    - image: /uploads/deiz3z3k-1.jpeg
      alt: 'Nautor Swan: Innovating through tradition'
      link: articles/nautor-swan
      tags:
        - sailing
        - number 03
      title: 'Nautor Swan: Innovating through tradition'
      description: >+
        Redefining high-performance cruising, the new generation of Swan 98
        offers speed and luxury. Just as comfortable crossing oceans as hopping
        between shallow tropical islands, racing around headlands or navigating
        the fjords, the Finnish-built yachts are widely touted as the best of
        all worlds. TIDE speaks with Nautor Swan’s team to find out what the 98
        is all about.

    - image: /uploads/tide-magazine-sailing-sonny-5-1.jpg
      alt: ' The Adventure Squad '
      link: /articles/sonny
      tags:
        - ' Sailing'
        - number 02
      title: ' The Adventure Squad '
      description: ' When time is the ultimate luxury, what does a $2.5 million refurbishment of a sailing yacht look like? Patrick Gavin-Brynes, captain of the newly re-launched Sonny III, talks hydraulic systems, custom carbon-fibre rigging and hoisting 192 square metres of sail in under 60 seconds '
    - image: /uploads/qhxzfote.jpg
      alt: 'The Pocket Superyacht '
      link: /articles/the-pocket-superyacht
      tags:
        - 'Sailing '
        - number 02
      title: 'The Pocket Superyacht '
      description: ' Superyacht is an evocative word-enormous craft with lofty rigs and loftier budgets, fully customised, complex creations. But the core values of what make a superyacht (luxury, style and personal expression)are not the sole preserve of custom vessels well in excess of24m....let’s take a look at the pocket superyacht. '
    - image: /uploads/tide-magazine-sailing-perseverance-3-1.jpg
      alt: ' Perseverance on Charter '
      link: /articles/perseverance
      tags:
        - Sailing
        - number 02
      title: ' Perseverance on Charter '
      description: ' The price put on superyacht charters is famously opaque, with unexpected add-ons making it hard to predict how much you’ll spend. Bypassing brokers and agents, the owners of Perseverance are taking a different approach, bringing bespoke yet all-inclusive packages to the ultra-luxury sphere. '
    - image: /uploads/tide-magazine-sailing-supersloop-1-1.jpg
      alt: The Rise of the Supersloop
      link: articles/supersloop
      tags:
        - sailing
        - number 01
      title: The Rise of the Supersloop
      description: >+
        If the enduring arms race in the motor yacht world is anything to go by,
        bigger is better when it comes to luxury yachting. But it’s not just
        motor yachts that are increasing in size; the rise of the super sloop is
        shaping our horizon.

    - image: /uploads/tide-magazine-sailing-the-cat-is-back-1-1.jpg
      alt: The Cat is Black
      link: articles/the-cat-is-back
      tags:
        - sailing
        - number 01
      title: The Cat is Black
      description: >+
        The insatiable desire for more than one hull continues unabated and
        whilst the industry seeks to meet demand, one yard at the sharp end of
        the market is already raising the bar.

    - image: /uploads/download-51.jpg
      alt: Sailing in the City - New York
      link: articles/new-york
      tags:
        - sailing
        - number 01
      title: Sailing in the City - New York
      description: >+
        While the industrial waterways of New York City might not be the typical
        backdrop for a luxury yacht, sailing into New York Harbour is a magical
        experience that should be on every boat owner’s bucket list. Under 1000
        nautical miles from the Caribbean and just over 3000 from the
        Mediterranean, the city offers an extra special welcome to those
        arriving from the Atlantic Ocean.

    - image: /uploads/tide-magazine-sailing-modern-ketch-1-1.jpg
      alt: The Modern Ocean Ketch
      link: articles/modern-ketch
      tags:
        - sailing
        - number 01
      title: The Modern Ocean Ketch
      description: >+
        The heritage of the modern ocean ketch comprises many of the world’s
        most iconic yachts and, whilst the latest creations are larger, faster
        and more technologically advanced, they continue to prove why the twin
        rig concept ticks all the boxes.

    - image: /uploads/futureisnow.jpeg
      alt: The Future is Now
      link: articles/future-is-now
      tags:
        - sailing
        - number 01
      title: The Future is Now
      description: >+
        At the dawn of the early Twenties, we find ourselves on the threshold of
        a new era in sailing; the America’s Cup enacted at speeds in excess of
        40 knots and the drive towards environmental responsibility set against
        a backdrop of ever larger motor yacht builds. So, what does the future
        hold for the humble sailing yacht?

